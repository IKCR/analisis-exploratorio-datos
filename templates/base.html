<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Estadísticas de educación por municipio para preescolar, básica y media.">
  <title>{% block titulo %}{{ titulo }} | EduMunicipios{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="menu-shell" aria-label="Menú desplegable">
      <button class="menu-toggle" type="button" aria-label="Abrir menú">
        <span>Menu</span>
      </button>

      <aside class="sidebar-panel" aria-label="Menú lateral">
        <div class="sidebar-brand">
          <a href="{{ url_for('inicio') }}" class="brand-link">
            <span>educacion municipios</span>
          </a>
        </div>

        <nav class="sidebar-nav" aria-label="Navegación principal">
          <div class="nav-group compact-group">
            <a class="nav-link {% if request.endpoint == 'inicio' %}active{% endif %}" href="{{ url_for('inicio') }}">
              <span class="nav-index">1</span>
              <span>Inicio</span>
            </a>
          </div>

          <div class="nav-group compact-group has-dropdown open">
            <button class="nav-link menu-trigger{% if request.endpoint in ['poblacional', 'territorial', 'temporal', 'multivariada'] %} active{% endif %}" type="button" aria-expanded="true">
              <span class="nav-index">2</span>
              <span>Análisis</span>
              <i class="bi bi-chevron-down chevron" aria-hidden="true"></i>
            </button>
            <div class="submenu">
              <a class="submenu-item{% if request.endpoint == 'poblacional' %} active{% endif %}" href="{{ url_for('poblacional') }}">
                <span class="submenu-index">1</span>
                <span>Dimensión poblacional</span>
              </a>
              <a class="submenu-item{% if request.endpoint == 'territorial' %} active{% endif %}" href="{{ url_for('territorial') }}">
                <span class="submenu-index">2</span>
                <span>Dimensión territorial</span>
              </a>
              <a class="submenu-item{% if request.endpoint == 'temporal' %} active{% endif %}" href="{{ url_for('temporal') }}">
                <span class="submenu-index">3</span>
                <span>Dimensión temporal</span>
              </a>
              <a class="submenu-item{% if request.endpoint == 'multivariada' %} active{% endif %}" href="{{ url_for('multivariada') }}">
                <span class="submenu-index">4</span>
                <span>Dimensión multivariada</span>
              </a>
            </div>
          </div>

          <div class="nav-group compact-group">
            <a class="nav-link dataset-link" href="{{ url_for('dataset_file') }}" target="_blank" rel="noopener noreferrer">
              <span class="nav-index">3</span>
              <span>CSV</span>
            </a>
          </div>
        </nav>
      </aside>
    </div>

    <div class="content-panel">
      <main>
        {% block contenido %}{% endblock %}
      </main>

      <footer class="site-footer">
        <div class="container footer-content">
          <span>educacion municipios</span>
          <span>Estadísticas de educación en preescolar, básica y media por municipio.</span>
        </div>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const menuShell = document.querySelector('.menu-shell');
      const trigger = document.querySelector('.menu-trigger');

      if (menuShell) {
        menuShell.addEventListener('mouseleave', function () {
          menuShell.classList.remove('hovered');
        });
      }

      if (trigger) {
        trigger.addEventListener('click', function () {
          const parent = this.closest('.has-dropdown');
          const isOpen = parent.classList.toggle('open');
          this.setAttribute('aria-expanded', String(isOpen));
        });
      }
    });
  </script>
</body>
</html>
